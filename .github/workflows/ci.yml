# CI: run all test suites, then build and push the three Docker images to Docker Hub.
#
# Pull requests: tests + image builds (no push).
# Push to main / tags v*: tests, then push images.
#
# Required repository secrets: DOCKER_USERNAME, DOCKER_PASSWORD (a Docker Hub access token is recommended).
# Optional repository variables:
#   DOCKERHUB_NAMESPACE  Docker Hub user/org to push to (defaults to DOCKER_USERNAME)
#   VITE_API_BASE_URL, VITE_AI_BASE_URL, VITE_SITE_URL  URLs baked into the frontend image
#     (default to the docker-compose ports: http://localhost:8080 / :8000 / :3000)

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    name: API tests (JUnit + Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: api/pom.xml
      # `verify` runs unit tests (surefire) and the PostgreSQL 16 Testcontainers ITs (failsafe);
      # the runner's Docker daemon is used for the containers.
      - name: Unit and integration tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports
            api/target/failsafe-reports
          retention-days: 7

  test-ai:
    name: AI service tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      # Tests use fakes for the LLM, embeddings and Chroma, so no Ollama is needed.
      - name: pytest
        run: python -m pytest

  test-frontend:
    name: Frontend tests (Vitest) and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Vitest
        run: npm test
      - name: Type-check and production build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080
          VITE_AI_BASE_URL: http://localhost:8000
          VITE_SITE_URL: http://localhost:3000

  docker:
    name: Docker image (${{ matrix.name }})
    needs: [test-api, test-ai, test-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
            image: amberpea-api
          - name: ai-service
            dockerfile: ai-service/Dockerfile
            image: amberpea-ai
          - name: frontend
            dockerfile: frontend/Dockerfile
            image: amberpea-frontend
    env:
      # Push only for pushes to main or version tags, never for pull requests.
      PUSH: ${{ github.event_name != 'pull_request' }}
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags: latest (main), sha-<short>, and semver for v* tags (e.g. 1.2.3, 1.2).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ env.NAMESPACE || 'local' }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Amber & Pea Law (fictional sample firm) - ${{ matrix.name }}

      # Build context is the repo root; each Dockerfile has its own Dockerfile.dockerignore allowlist.
      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8080' }}
            VITE_AI_BASE_URL=${{ vars.VITE_AI_BASE_URL || 'http://localhost:8000' }}
            VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
