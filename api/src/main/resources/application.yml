# All values come from environment variables. For local runs, api/.env is imported
# (see .env.example). Real environment variables take precedence over the file.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: amber-pea-law-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:amber-pea-law-api}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-display-name: ${ADMIN_DISPLAY_NAME:Site Admin}
  rate-limit:
    trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED:false}
    forms-per-minute: ${RATE_LIMIT_FORMS_PER_MINUTE:5}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
  booking:
    timezone: ${BOOKING_TIMEZONE:America/Chicago}
    business-days: ${BOOKING_BUSINESS_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY}
    open: ${BOOKING_OPEN:09:00}
    close: ${BOOKING_CLOSE:17:00}
    slot-minutes: ${BOOKING_SLOT_MINUTES:30}
    min-notice-hours: ${BOOKING_MIN_NOTICE_HOURS:2}
    max-days-ahead: ${BOOKING_MAX_DAYS_AHEAD:30}
